<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame — вход</title><link rel="stylesheet" href="app.css"></head><body class="login"><div class="brand">Frame</div><h1>Вход</h1><form id="loginForm"><input type="hidden" id="loginCsrf" value="LOGIN_CSRF_VALUE"><label>Аккаунт<select id="loginName" name="username" autocomplete="username"><option value="кошка">кошка</option><option value="код">код</option></select></label><label>Пароль<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required></label><label class="remember"><input type="checkbox" id="remember" checked> Запомнить вход на 30 дней</label><button class="primary" id="signIn" type="submit">Войти</button><p id="loginError" role="alert"></p></form><script src="login.js"></script></body></html>
